# SSM Parameter Store as the secret source for External Secrets (installed in plataforma by
# Terraform, D-38). No auth block: the AWS provider uses the default credential chain, which ends at
# the node's LabRole through IMDS (the Learner Lab allows no IRSA). Only the two app namespaces may
# use it. Limit: both namespaces can read both environments' parameters (one node role for all).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: statline-ssm
spec:
  conditions:
    - namespaces:
        - statline-staging
        - statline-prod
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
