# Environment: statline-prod, follows branch main (Argo CD Application statline-prod).
environment: prod

networkPolicies:
  enabled: true

ingress:
  # Placeholder: replace with the real domain before deploying.
  host: "<dominio>"
  tls:
    enabled: true
    secretName: statline-tls
    clusterIssuer: letsencrypt-prod

redis:
  dbIndex: 0

secrets:
  csi:
    keyvaultName: kv-statline-REPLACE
    tenantId: REPLACE-TENANT-ID
    userAssignedIdentityID: REPLACE-IDENTITY-CLIENT-ID
    objects:
      DATABASE_URL: database-url-prod
      JWT_SECRET: jwt-secret-prod
      JWT_REFRESH_SECRET: jwt-refresh-secret-prod
      API_SPORTS_KEY: api-sports-key
      BALLDONTLIE_API_KEY: balldontlie-api-key

# Image tags: bumped by cd.yml (repository_dispatch from the app repos). Do not edit by hand.
web:
  image:
    tag: "0000000"
api:
  autoscaling:
    enabled: true
  image:
    tag: "0000000"
predicciones:
  autoscaling:
    enabled: true
  image:
    tag: "0000000"
ingesta:
  config:
    # Fallback data can duplicate games; keep off until deduplication is verified.
    fallbackHabilitado: "false"
  image:
    tag: "0000000"
