{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host }}
{{- $labels := include "statline.labels" (dict "component" "ingress" "ctx" . "version" "") }}
{{- $tls := .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- $labels | nindent 4 }}
  {{- if $tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "ingress.tls.clusterIssuer is required when tls is enabled" $tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # /api before /: the api owns its prefix, the SPA gets everything else.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "statline.fullname" (dict "component" "api" "ctx" .) }}
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "statline.fullname" (dict "component" "web" "ctx" .) }}
                port:
                  number: 80
{{- end }}
