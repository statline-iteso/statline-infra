{{- $c := "api" -}}
{{- $name := include "statline.fullname" (dict "component" $c "ctx" $) -}}
{{- $tag := .Values.api.image.tag -}}
{{- $labels := include "statline.labels" (dict "component" $c "ctx" $ "version" $tag) -}}
{{- $lanzador := .Values.api.ingestaLanzador -}}
{{- if not (has $lanzador (list "deshabilitado" "kubernetes")) -}}
{{- fail (printf "api.ingestaLanzador must be deshabilitado or kubernetes, got %q" $lanzador) -}}
{{- end -}}
{{- $automount := or .Values.api.serviceAccount.automount (eq $lanzador "kubernetes") -}}
{{- define "statline.api.config" -}}
PORT: {{ .Values.api.port | toString | quote }}
PREDICCIONES_URL: {{ printf "http://%s" (include "statline.fullname" (dict "component" "predicciones" "ctx" .)) | quote }}
REDIS_URL: {{ include "statline.redisUrl" . | quote }}
LOG_LEVEL: {{ .Values.api.config.logLevel | quote }}
JWT_ACCESS_TTL: {{ .Values.api.config.jwtAccessTtl | quote }}
JWT_REFRESH_TTL: {{ .Values.api.config.jwtRefreshTtl | quote }}
CACHE_TTL_S: {{ .Values.api.config.cacheTtlS | toString | quote }}
RATE_LIMIT_PER_MIN: {{ .Values.api.config.rateLimitPerMin | toString | quote }}
RATE_LIMIT_LOGIN_PER_MIN: {{ .Values.api.config.rateLimitLoginPerMin | toString | quote }}
INGESTA_LANZADOR: {{ .Values.api.ingestaLanzador | quote }}
INGESTA_CRONJOB_PREFIJO: {{ printf "%s-" .Release.Name | quote }}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
automountServiceAccountToken: {{ $automount }}
{{- if eq $lanzador "kubernetes" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-ingesta
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-ingesta
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-ingesta
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- include "statline.api.config" . | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  # The HPA owns the count when enabled (hpa.yaml): spec.replicas is then omitted.
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "statline.selectorLabels" (dict "component" $c) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        checksum/config: {{ include "statline.api.config" . | sha256sum | quote }}
        {{- if eq .Values.secrets.mode "plain" }}
        checksum/secret: {{ include "statline.secretData" . | sha256sum | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ $automount }}
      securityContext:
        {{- include "statline.podSecurity" (dict "uid" .Values.api.runAsUser) | nindent 8 }}
      # Migrations run with the same image before the new version serves traffic (D-12).
      initContainers:
        - name: migrate
          image: {{ include "statline.image" (dict "component" $c "image" .Values.api.image "ctx" $) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            # prisma may touch $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
            {{- include "statline.secretEnv" (dict "keys" .Values.api.secretKeys "secretName" .Values.secrets.name) | nindent 12 }}
          resources:
            {{- toYaml .Values.api.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "statline.containerSecurity" . | nindent 12 }}
          volumeMounts:
            {{- include "statline.tmpVolumeMount" . | nindent 12 }}
            {{- include "statline.secretVolumeMount" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "statline.image" (dict "component" $c "image" .Values.api.image "ctx" $) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            {{- include "statline.secretEnv" (dict "keys" .Values.api.secretKeys "secretName" .Values.secrets.name) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "statline.containerSecurity" . | nindent 12 }}
          volumeMounts:
            {{- include "statline.tmpVolumeMount" . | nindent 12 }}
            {{- include "statline.secretVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "statline.tmpVolume" . | nindent 8 }}
        {{- include "statline.secretVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "statline.selectorLabels" (dict "component" $c) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
