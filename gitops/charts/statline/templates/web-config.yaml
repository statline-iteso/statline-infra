{{- if include "statline.webConfig.enabled" . }}
{{- $sentry := .Values.sentry.enabled }}
{{- $cognito := eq (include "statline.authMode" .) "cognito" }}
# /config.js of the SPA, rendered by External Secrets from SSM and mounted by web.yaml:
#   Sentry (frontend D-07): the browser DSN and this environment. A DSN that is not an https URL
#     (Terraform's "set-me" placeholder) renders as empty, which keeps Sentry off in the browser.
#   Cognito (D-47): the user pool and SPA client ids, which change with every make apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-web-config" .Release.Name }}
  labels:
    {{- include "statline.labels" (dict "component" "web" "ctx" . "version" "") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.external.storeName }}
  target:
    name: {{ printf "%s-web-config" .Release.Name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.js: |
          window.__STATLINE_CONFIG__ = {
          {{- if $sentry }}
            sentryDsn: {{ `{{ if hasPrefix "https://" .dsn }}{{ .dsn | toJson }}{{ else }}""{{ end }}` }},
            sentryEnvironment: {{ .Values.sentry.environment | default .Values.environment | toJson }},
          {{- end }}
          {{- if $cognito }}
            cognitoRegion: {{ .Values.auth.cognito.region | toJson }},
            cognitoUserPoolId: {{ `{{ .userPoolId | toJson }}` }},
            cognitoClientId: {{ `{{ .clientId | toJson }}` }},
          {{- end }}
          };
  data:
    {{- if $sentry }}
    - secretKey: dsn
      remoteRef:
        key: {{ required "sentry.webDsnParameter is required" .Values.sentry.webDsnParameter | quote }}
    {{- end }}
    {{- if $cognito }}
    - secretKey: userPoolId
      remoteRef:
        key: {{ required "auth.cognito.userPoolIdParameter is required" .Values.auth.cognito.userPoolIdParameter | quote }}
    - secretKey: clientId
      remoteRef:
        key: {{ required "auth.cognito.clientIdParameter is required" .Values.auth.cognito.clientIdParameter | quote }}
    {{- end }}
{{- end }}
