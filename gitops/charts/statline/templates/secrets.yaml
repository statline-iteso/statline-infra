{{- $mode := .Values.secrets.mode -}}
{{- if not (has $mode (list "external" "plain")) -}}
{{- fail (printf "secrets.mode must be external or plain, got %q" $mode) -}}
{{- end }}
{{- $labels := include "statline.labels" (dict "component" "secrets" "ctx" . "version" "") }}
{{- if eq $mode "external" }}
# External Secrets (installed in plataforma by Terraform) syncs SSM Parameter Store into the Secret
# .Values.secrets.name, through the ClusterSecretStore in gitops/plataforma (D-38). Wave -1: the
# Secret exists before the workloads that read it. ESO keeps it in sync every refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secrets.external.storeName is required" .Values.secrets.external.storeName }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  # Key = env var / Secret key, value = SSM parameter name.
  data:
    {{- range $envName, $param := .Values.secrets.external.parameters }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ required (printf "secrets.external.parameters.%s is required" $envName) $param | quote }}
    {{- end }}
    {{- if eq (include "statline.authMode" .) "cognito" }}
    # Cognito pool and SPA client of this environment (D-47), for the api.
    - secretKey: {{ .Values.auth.cognito.userPoolIdKey }}
      remoteRef:
        key: {{ required "auth.cognito.userPoolIdParameter is required" .Values.auth.cognito.userPoolIdParameter | quote }}
    - secretKey: {{ .Values.auth.cognito.clientIdKey }}
      remoteRef:
        key: {{ required "auth.cognito.clientIdParameter is required" .Values.auth.cognito.clientIdParameter | quote }}
    {{- end }}
{{- else }}
# k3d only: plain Secret rendered from values (fake dev values).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  {{- include "statline.secretData" . | nindent 2 }}
{{- end }}
