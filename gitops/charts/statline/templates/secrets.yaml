{{- $mode := .Values.secrets.mode -}}
{{- if not (has $mode (list "csi" "plain")) -}}
{{- fail (printf "secrets.mode must be csi or plain, got %q" $mode) -}}
{{- end }}
{{- $labels := include "statline.labels" (dict "component" "secrets" "ctx" . "version" "") }}
{{- if eq $mode "csi" }}
# Syncs Key Vault into the Kubernetes Secret .Values.secrets.name. The Secret only exists
# while some pod mounts the CSI volume (every workload that reads it does).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.secretProviderClassName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "secrets.csi.userAssignedIdentityID is required" .Values.secrets.csi.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "secrets.csi.keyvaultName is required" .Values.secrets.csi.keyvaultName | quote }}
    tenantId: {{ required "secrets.csi.tenantId is required" .Values.secrets.csi.tenantId | quote }}
    # Key = env var / Secret key, value = Key Vault secret name.
    objects: |
      array:
      {{- range $envName, $kvName := .Values.secrets.csi.objects }}
        - |
          objectName: {{ $kvName }}
          objectAlias: {{ $envName }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        {{- range $envName, $kvName := .Values.secrets.csi.objects }}
        - objectName: {{ $envName }}
          key: {{ $envName }}
        {{- end }}
{{- else }}
# k3d only: plain Secret rendered from values (fake dev values).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  {{- include "statline.secretData" . | nindent 2 }}
{{- end }}
