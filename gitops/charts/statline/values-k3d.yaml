# Local cluster (make k3d-up + make k3d-deploy). Install into statline-staging.
# Everything here is DEV ONLY: fake secrets, an ephemeral PostgreSQL, no TLS.
environment: local

global:
  # Images are imported with `k3d image import`, not pulled.
  imageRegistry: ""

ingress:
  host: statline.localhost
  tls:
    enabled: false

# Single replicas: a minAvailable 1 PDB on web and api would block node drains, so PDBs are off here.
networkPolicies:
  enabled: true
  # k3d-up.sh installs ingress-nginx into its own namespace, not plataforma.
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Dev Postgres runs in the release namespace (devPostgres below); there is no RDS subnet.
  postgresCidr: ""

# No Prometheus Operator CRDs in k3d.
monitoring:
  enabled: false

redis:
  dbIndex: 1

secrets:
  mode: plain
  plain:
    data:
      # DATABASE_URL is overwritten by the dev Postgres URL (devPostgres below).
      DATABASE_URL: ""
      JWT_SECRET: dev-only-jwt-secret-do-not-use
      JWT_REFRESH_SECRET: dev-only-refresh-secret-do-not-use
      API_SPORTS_KEY: dev-only-not-a-real-key
      BALLDONTLIE_API_KEY: dev-only-not-a-real-key
      SEED_ADMIN_PASSWORD: dev-only-admin-password

devPostgres:
  enabled: true
  user: statline
  password: statline-dev-only
  database: statline

# Local images built with tag `local` (see gitops/README.md).
web:
  replicas: 1
  pdb:
    enabled: false
  image:
    repository: statline/web
    tag: local
    pullPolicy: Never
api:
  replicas: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  image:
    repository: statline/api
    tag: local
    pullPolicy: Never
predicciones:
  image:
    repository: statline/predicciones
    tag: local
    pullPolicy: Never
ingesta:
  image:
    repository: statline/ingesta
    tag: local
    pullPolicy: Never
