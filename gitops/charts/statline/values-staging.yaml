# Environment: statline-staging, follows branch develop (Argo CD Application statline-staging).
environment: staging

networkPolicies:
  enabled: true

ingress:
  # nip.io on the bootstrap Elastic IP (terraform -chdir=terraform/bootstrap output -raw ingress_ip, D-38).
  host: "staging.52.71.150.91.nip.io"
  tls:
    enabled: true
    secretName: statline-tls
    # letsencrypt-prod since D-39: the staging issuer's untrusted chain broke browsers and the public smoke check.
    clusterIssuer: letsencrypt-prod

redis:
  dbIndex: 1

secrets:
  external:
    parameters:
      DATABASE_URL: /statline/staging/database-url
      JWT_SECRET: /statline/staging/jwt-secret
      JWT_REFRESH_SECRET: /statline/staging/jwt-refresh-secret
      API_SPORTS_KEY: /statline/comun/api-sports-key
      BALLDONTLIE_API_KEY: /statline/comun/balldontlie-api-key
      SEED_ADMIN_PASSWORD: /statline/staging/seed-admin-password
      # Sentry DSNs, one project per service; the environment tags the events (D-43).
      SENTRY_DSN_API: /statline/comun/sentry-dsn-api
      SENTRY_DSN_PREDICCIONES: /statline/comun/sentry-dsn-predicciones
      SENTRY_DSN_INGESTA: /statline/comun/sentry-dsn-ingesta

sentry:
  enabled: true
  webDsnParameter: /statline/comun/sentry-dsn-web
  # Every request traced (D-43): low traffic, and the presentation shows traces in Sentry. Lower it
  # (e.g. "0.2") if the plan's span quota gets close.
  tracesSampleRate: "1.0"

# Cognito (D-47): staging signs in through its pool since 2026-11-25. Prod follows with v1.2.0.
auth:
  mode: cognito
  cognito:
    userPoolIdParameter: /statline/staging/cognito-user-pool-id
    clientIdParameter: /statline/staging/cognito-client-id

# Image tags: bumped by cd.yml (repository_dispatch from the app repos). Do not edit by hand.
web:
  image:
    tag: "32d6435"
api:
  autoscaling:
    enabled: true
  image:
    tag: "1c7bf9a"
predicciones:
  autoscaling:
    enabled: true
  image:
    tag: "1c7bf9a"
ingesta:
  config:
    # On since D-40: the free API-Sports plan answers nothing, so the fallbacks are the only real data
    # and no game can arrive from two providers. Prod too since D-41.
    fallbackHabilitado: "true"
  image:
    tag: "1c7bf9a"

monitoring:
  enabled: true
