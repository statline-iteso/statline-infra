# Environment: statline-staging, follows branch develop (Argo CD Application statline-staging).
environment: staging

networkPolicies:
  enabled: true

ingress:
  # nip.io on the bootstrap Elastic IP (terraform -chdir=terraform/bootstrap output -raw ingress_ip, D-38).
  host: "staging.52.71.150.91.nip.io"
  tls:
    enabled: true
    secretName: statline-tls
    # letsencrypt-prod since D-39: the staging issuer's untrusted chain broke browsers and the public smoke check.
    clusterIssuer: letsencrypt-prod

redis:
  dbIndex: 1

secrets:
  external:
    parameters:
      DATABASE_URL: /statline/staging/database-url
      JWT_SECRET: /statline/staging/jwt-secret
      JWT_REFRESH_SECRET: /statline/staging/jwt-refresh-secret
      API_SPORTS_KEY: /statline/comun/api-sports-key
      BALLDONTLIE_API_KEY: /statline/comun/balldontlie-api-key
      SEED_ADMIN_PASSWORD: /statline/staging/seed-admin-password

# Image tags: bumped by cd.yml (repository_dispatch from the app repos). Do not edit by hand.
web:
  image:
    tag: "1d11fbc"
api:
  autoscaling:
    enabled: true
  image:
    tag: "4d35783"
predicciones:
  autoscaling:
    enabled: true
  image:
    tag: "4d35783"
ingesta:
  config:
    # Fallback data can duplicate games; keep off until deduplication is verified.
    fallbackHabilitado: "false"
  image:
    tag: "4d35783"

monitoring:
  enabled: true
