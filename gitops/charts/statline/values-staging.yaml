# Environment: statline-staging, follows branch develop (Argo CD Application statline-staging).
environment: staging

ingress:
  # Placeholder: replace with the real domain before deploying.
  host: "staging.<dominio>"
  tls:
    enabled: true
    secretName: statline-tls
    clusterIssuer: letsencrypt-staging

redis:
  dbIndex: 1

secrets:
  csi:
    keyvaultName: kv-statline-REPLACE
    tenantId: REPLACE-TENANT-ID
    userAssignedIdentityID: REPLACE-IDENTITY-CLIENT-ID
    objects:
      DATABASE_URL: database-url-staging
      JWT_SECRET: jwt-secret-staging
      JWT_REFRESH_SECRET: jwt-refresh-secret-staging
      API_SPORTS_KEY: api-sports-key
      BALLDONTLIE_API_KEY: balldontlie-api-key

# Image tags: bumped by cd.yml (repository_dispatch from the app repos). Do not edit by hand.
web:
  image:
    tag: "0000000"
api:
  autoscaling:
    enabled: true
  image:
    tag: "0000000"
predicciones:
  autoscaling:
    enabled: true
  image:
    tag: "0000000"
ingesta:
  config:
    # Fallback data can duplicate games; keep off until deduplication is verified.
    fallbackHabilitado: "false"
  image:
    tag: "0000000"
