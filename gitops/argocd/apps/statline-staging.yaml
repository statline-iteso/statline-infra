apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: statline-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: statline
  source:
    repoURL: https://github.com/statline-iteso/statline-infra.git
    targetRevision: develop
    path: gitops/charts/statline
    helm:
      releaseName: statline-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: statline-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
