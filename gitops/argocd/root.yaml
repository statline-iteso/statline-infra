# App of apps. Bootstrap once: kubectl apply -f gitops/argocd/project.yaml -f gitops/argocd/root.yaml
# It then manages every Application in gitops/argocd/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: statline
  source:
    repoURL: https://github.com/statline-iteso/statline-infra.git
    targetRevision: develop
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
