# External Secrets Operator, one replica of each part. No IRSA in the Learner Lab: the AWS
# ParameterStore provider uses the default credential chain, which ends at the node's LabRole
# through IMDS (hop limit 2, module eks). The ClusterSecretStore lives in gitops/plataforma.
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
serviceMonitor:
  enabled: true
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
