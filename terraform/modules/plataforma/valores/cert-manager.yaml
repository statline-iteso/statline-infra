# cert-manager. ClusterIssuers (Let's Encrypt) are applied by Argo CD from gitops/, not here.
crds:
  enabled: true
  keep: true
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
