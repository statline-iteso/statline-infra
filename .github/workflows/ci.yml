name: CI

# Proposal §4.3, step 1 (Terraform part): fmt, validate and tflint on every push and PR, and a
# `terraform plan` of principal posted as a PR comment. The plan uses the Learner Lab keys that
# `make creds` stores as the AWS_* secrets (D-38). They expire with the lab session, so the plan job
# skips with a notice when they are stale, and it never fails the PR (informational only).
# Also: Trivy IaC scan of the Terraform and the rendered charts (accepted findings in
# .trivyignore), actionlint and zizmor on the workflows, gitleaks over the whole history.
# CodeQL (Actions) runs in codeql.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
  # auto-merge.yml starts this run on develop after each merge (GITHUB_TOKEN merges fire no push).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
      - name: terraform fmt
        run: terraform fmt -recursive -check terraform
      - name: terraform validate
        run: |
          for d in terraform/bootstrap terraform/principal; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.54.0
      - name: tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh

  plan:
    name: terraform plan
    needs: terraform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # plan comment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lab credentials still valid?
        id: creds
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::notice::No AWS_* secrets (run make creds); skipping terraform plan."
          elif ! scripts/check-creds.sh; then
            echo "::notice::Lab credentials expired (run make creds in a new lab session); skipping terraform plan."
          elif ! aws s3api head-bucket --bucket "statline-tfstate-$(aws sts get-caller-identity --query Account --output text)" 2>/dev/null; then
            echo "::notice::No state bucket in this lab account yet (run make bootstrap); skipping terraform plan."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.creds.outputs.ok == 'true'
        with:
          terraform_version: 1.10.5
      # init and plan are informational: a failure is reported in the PR comment, not as a red check.
      - name: terraform init
        if: steps.creds.outputs.ok == 'true'
        id: init
        continue-on-error: true
        working-directory: terraform/principal
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=statline-tfstate-${acct}" \
            -backend-config="key=principal.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: terraform plan
        if: steps.creds.outputs.ok == 'true' && steps.init.outcome == 'success'
        id: plan
        continue-on-error: true
        working-directory: terraform/principal
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan 2>&1 | tee plan.txt
          echo "summary=$(grep -E '^(Plan:|No changes)' plan.txt | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Comment the plan on the PR
        if: always() && steps.creds.outputs.ok == 'true' && hashFiles('terraform/principal/plan.txt') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY: "${{ steps.plan.outputs.summary || 'plan failed, see the log below' }}"
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("terraform/principal/plan.txt", "utf8");
            const body = [
              "### `terraform plan` · principal",
              `**${process.env.SUMMARY}**`,
              "<details><summary>Full plan</summary>\n",
              "```hcl",
              plan.length > 60000 ? plan.slice(-60000) : plan,
              "```",
              "</details>",
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  helm:
    name: helm · lint, kubeconform
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3
      - name: kubeconform (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: make helm-lint
        run: make helm-lint
      - name: make helm-validate
        run: make helm-validate

  iac:
    name: iac · trivy config
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3
      - name: Render the charts (each environment, monitoring on)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered"; mkdir -p "$out"
          for env in staging prod; do
            helm template "statline-$env" gitops/charts/statline -f "gitops/charts/statline/values-$env.yaml" \
              --set monitoring.enabled=true > "$out/statline-$env.yaml"
          done
          helm template redis gitops/charts/redis > "$out/redis.yaml"
      - name: Trivy config (fail on HIGH/CRITICAL; accepted findings in .trivyignore)
        run: |
          set -euo pipefail
          run() { docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/rendered:/rendered:ro" -w /repo "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore --skip-version-check "$@"; }
          run terraform
          run /rendered
          run gitops/argocd
          run gitops/plataforma

  workflows:
    name: workflows · actionlint, zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (bundles shellcheck for run steps)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
      - name: zizmor (workflow security; fails on any finding)
        run: uvx zizmor@1.31.1 --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just this commit
          persist-credentials: false
      - name: gitleaks over every commit
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --verbose
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
