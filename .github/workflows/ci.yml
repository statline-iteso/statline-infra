name: CI

# Proposal §4.3, step 1 (Terraform part): fmt, validate and tflint on every push and PR, and a
# `terraform plan` whose summary is posted as a PR comment. The plan job only runs once the
# Azure credentials exist (repository secrets AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID for OIDC, and TFSTATE_* for the backend); see docs/pendientes.md.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform fmt -recursive -check terraform
      - name: terraform validate
        run: |
          for d in terraform/bootstrap terraform/principal; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - name: tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  plan:
    name: terraform plan
    needs: terraform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
      pull-requests: write # plan comment
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Azure credentials configured?
        id: creds
        run: |
          if [[ -n "$ARM_CLIENT_ID" && -n "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Azure secrets not set yet; skipping terraform plan."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          terraform_version: 1.9.8
      - name: terraform init
        if: steps.creds.outputs.ok == 'true'
        working-directory: terraform/principal
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate"
      - name: terraform plan
        if: steps.creds.outputs.ok == 'true'
        id: plan
        working-directory: terraform/principal
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          echo "summary=$(grep -E '^(Plan:|No changes)' plan.txt | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Comment the plan on the PR
        if: steps.creds.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("terraform/principal/plan.txt", "utf8");
            const body = [
              "### `terraform plan` · principal",
              `**${process.env.SUMMARY}**`,
              "<details><summary>Full plan</summary>\n",
              "```hcl",
              plan.length > 60000 ? plan.slice(-60000) : plan,
              "```",
              "</details>",
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  helm:
    name: helm · lint, kubeconform
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: kubeconform (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: make helm-lint
        run: make helm-lint
      - name: make helm-validate
        run: make helm-validate
