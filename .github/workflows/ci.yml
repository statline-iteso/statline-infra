name: CI

# Proposal §4.3, step 1 (Terraform part): fmt, validate and tflint on every push and PR.
# The PR `terraform plan` comment comes back once the principal stack is on AWS: it will use the
# lab keys that `make creds` stores as the AWS_* secrets (D-38).

on:
  push:
    branches: [main, develop]
  pull_request:
  # auto-merge.yml starts this run on develop after each merge (GITHUB_TOKEN merges fire no push).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: terraform fmt
        run: terraform fmt -recursive -check terraform
      - name: terraform validate
        run: |
          for d in terraform/bootstrap terraform/principal; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - name: tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  helm:
    name: helm · lint, kubeconform
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: kubeconform (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: make helm-lint
        run: make helm-lint
      - name: make helm-validate
        run: make helm-validate
